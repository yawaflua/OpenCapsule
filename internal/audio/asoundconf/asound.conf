# Managed by marusya-agent. The agent rewrites this file on every start
# from the copy built into it, keeping the equalizer set in the web panel
# (Колонки → Эквалайзер). Hand edits are lost; to keep your own file,
# remove the "marusya-eq" lines and the agent leaves it alone.

pcm.micboost {
    type softvol
    slave.pcm "hw:0,1"
    control { name "Mic Boost Capture Volume"; card 0 }
    min_dB -5.0
    max_dB 40.0
    resolution 121
}

# The amplifier's own volume reaches the speaker alone. The 3.5 mm jack is a
# line output fed from the TDM lines by a converter of its own, so nothing in
# the amplifier can move it, and the only volume both share is one applied to
# the samples before they leave the SoC. The stock firmware solved it the same
# way, with the same range.
pcm.mastervol {
    type softvol
    slave.pcm "hw:0,0"
    control { name "Master Playback Volume"; card 0 }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}

# Speaker voicing. The amplifier has a DSP of its own but no EQ table here,
# so it plays flat and the small driver booms. Correct it before the volume.
# Eq4p bands: mode (-1 off, 0 low shelf, 1 peak, 2 high shelf), f, Q, gain dB.
pcm.speakereq {
    type ladspa
    slave.pcm "plug:mastervol"
    path "/usr/lib/ladspa"
    plugins [{
        label Eq4p
        input {
            # marusya-eq: default
            controls [
                1  225   0.8   -3
                1  460   0.9   -6
                1  1650  0.85  -6
                1  4700  0.85  -6
            ]
            # marusya-eq: end
        }
    }]
}

# Capture goes through the gain by default: the PDM block has no gain of its
# own, so anything opening the card straight would record whatever the
# microphones give. plug in front converts rate and channel count for callers
# that want something other than the native four channels at 48 kHz.
pcm.!default {
    type asym
    playback.pcm "plug:speakereq"
    capture.pcm "plug:micboost"
}
